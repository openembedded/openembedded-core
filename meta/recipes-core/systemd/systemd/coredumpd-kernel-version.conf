# systemd 262's kernel coredump socket manager (systemd-coredumpd.service)
# requires the PIDFD_INFO_COREDUMP_SIGNAL pidfd flag, added in Linux 6.19
# (PIDFD_INFO_COREDUMP itself is from 6.16). Its ExecCondition
# (systemd-coredump --check-requirements) fails on older kernels, and combined
# with Restart=on-failure and the Upholds= relationship the unit flaps into
# start-limit-hit instead of being skipped, which fails the systemd runtime
# tests. OE-Core ships both linux-yocto 6.18 (< 6.19) and 7.2 (>= 6.19), so
# gate activation on the kernel version at runtime: this keeps coredumpd active
# on 7.2 while cleanly skipping it on 6.18. A ConditionKernelVersion= failure is
# a clean skip and does not trigger the restart/start-limit escalation.
# The per-coredump systemd-coredump@.service path remains available on all kernels.
# Upstream report: https://github.com/systemd/systemd/issues/43963
[Unit]
ConditionKernelVersion=>=6.19
